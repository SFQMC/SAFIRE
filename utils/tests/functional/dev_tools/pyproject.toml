[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safire_dev_tools"
version = "0.1.0"
description = "Development tools for functional testing of SAFIRE/AFQMC"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy",
    "h5py",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
packages = ["dev_tools"]

[tool.setuptools.package-dir]
dev_tools = "."
