nelec = [3,3]

[hamiltonian]
nbands = 2
U = 4      # defaults to "discrete_charge" for U > 0
U1 = -1.5  # normally, defaults to "discrete_spin" for U1 < 0
U2 = 1.0
J = 0.5

[hamiltonian.hst_types]
U1 = "discrete_spin"  # choices: "discrete_spin", "discrete_charge", 
                      #          "continuous_spin", "continuous_charge"
# ... only overrides HST type for the terms which are explicitly set

[lattice]
type = "square"
Ls = [3, 3]
boundaries = ["periodic", "periodic"]
twists = [0.0, 0.0]
